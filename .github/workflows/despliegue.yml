name: comprobar script y preparar version

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  preparar-version:
    runs-on: windows-latest
    steps:
      - name: Descargar Codigo
        uses: actions/checkout@v4

      - name: configurar php
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          coverage: none

      - name: Ejecutar script
        shell: pwsh
        run: ./desplegar.ps1 -RutaPHP 'php'

      - name: Guardar version preparada
        uses: actions/upload-artifact@v4
        with:
          name: version-preparada
          path: Pruebas/index.php
          if-no-files-found: error